name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Generate application icon
        run: python tools/make_icon.py
      - name: Build icon-branded executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WindowsUITransparency --icon=assets/windows-ui-transparency.ico --add-data "assets/windows-ui-transparency.ico;assets" windows_ui_transparency.py
      - name: Package executable and icon
        run: Compress-Archive -Path dist/WindowsUITransparency.exe, assets/windows-ui-transparency.ico, assets/windows-ui-transparency-icon.png -DestinationPath WindowsUITransparency-Windows.zip
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsUITransparency-Windows
          path: WindowsUITransparency-Windows.zip
          if-no-files-found: error
          retention-days: 30
